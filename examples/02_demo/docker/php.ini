; PHP configuration for the demo container.
; These are the values documented in the README's "Hosting on PHP" section.

upload_max_filesize = 6M
post_max_size = 8M
memory_limit = 128M
max_execution_time = 40

; Errors are turned into JSON messages by api.php; only the exception class reaches the log.
display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

; Session hardening. bootstrap.php sets the same flags at runtime; having them here too means a
; misconfigured deployment cannot silently weaken them.
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
session.save_path = "/var/lib/php/sessions"
; Matches the 30-minute idle timeout enforced in bootstrap.php.
session.gc_maxlifetime = 1800
