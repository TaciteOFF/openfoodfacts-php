# Apache virtual host for the demo.
#
# The Listen port and this <VirtualHost> port are rewritten at start-up from $PORT by
# docker/entrypoint.sh, so the same image runs unchanged on Fly.io, Render, Railway or locally.

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    # These platforms terminate TLS at their edge and forward plain HTTP to the container, so PHP
    # would not see HTTPS and would drop the Secure flag from the session cookie. The proxy sets
    # X-Forwarded-Proto itself and the container is not reachable directly, so trusting it here is
    # what keeps `session_set_cookie_params(['secure' => …])` in bootstrap.php correct.
    # If you ever expose this container directly to the internet, delete this line and terminate
    # TLS in front of it instead.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    # Nothing outside public/ is servable: app/, vendor/, composer.json and the lock file stay
    # unreachable over HTTP even if a path traversal were attempted.
    <Directory /var/www/html>
        Require all denied
    </Directory>

    <Directory /var/www/html/public>
        Require all granted
        AllowOverride None
        Options -Indexes -MultiViews +FollowSymLinks
        DirectoryIndex index.php
    </Directory>

    # Mirrors post_max_size in php.ini: an oversized upload is refused by Apache before PHP runs.
    LimitRequestBody 8388608

    # Logs go to the container's stdout/stderr, which is where every platform collects them.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
